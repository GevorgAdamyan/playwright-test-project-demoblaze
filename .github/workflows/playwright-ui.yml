name: Playwright Tests - UI Only

on:
  workflow_dispatch: # Allow manual trigger only

jobs:
  ui-test:
    name: Run UI Tests
    timeout-minutes: 45
    runs-on: ubuntu-latest
    
    env:
      # Environment variables for the tests
      BASE_URL: https://demoblaze.com
      BASE_URL_API: https://api.demoblaze.com
      CI: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Create environment file
        run: |
          echo "BASE_URL=${{ env.BASE_URL }}" >> .env
          echo "BASE_URL_API=${{ env.BASE_URL_API }}" >> .env
          echo "USERNAME=${{ secrets.USERNAME }}" >> .env
          echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
      
      - name: Create auth directory
        run: mkdir -p .auth
      
      - name: Run UI tests
        run: npx playwright test tests/UI --reporter=html,github
        
      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ui-test-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
      
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 7
      
      - name: Publish UI test results summary
        if: always()
        run: |
          echo "## 🖥️ UI Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "playwright-report/index.html" ]; then
            echo "✅ UI test report generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "📊 View the detailed report in the artifacts section" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ UI test report generation failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Suite:** UI Tests Only" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY