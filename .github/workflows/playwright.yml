name: Playwright Tests - All Tests

on:
  workflow_dispatch: # Allow manual trigger only

jobs:
  test:
    name: Run All E2E Tests (UI + API)
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      # Environment variables for the tests
      BASE_URL: https://demoblaze.com
      BASE_URL_API: https://api.demoblaze.com
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create environment file
        run: |
          echo "BASE_URL=${{ env.BASE_URL }}" >> .env
          echo "BASE_URL_API=${{ env.BASE_URL_API }}" >> .env
          echo "USERNAME=${{ secrets.USERNAME }}" >> .env
          echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env

      - name: Create auth directory
        run: mkdir -p .auth

      - name: Run Playwright tests
        run: npx playwright test --reporter=html,github

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 7

      - name: Publish test results summary
        if: always()
        run: |
          echo "## 🎭 Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "playwright-report/index.html" ]; then
            echo "✅ Test report generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "📊 View the detailed report in the artifacts section" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Test report generation failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
